<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jadwal Pengawas SAS Gasal 2026/2027</title>
<style>
:root{--bg:#f3f6f4;--surface:#fff;--ink:#132a1f;--muted:#566a5f;--line:#d1dcd5;--green:#00b050;--green-soft:#e0f4e8;--on-green:#04210f;--head:#0f3d26;--focus:#0a6cff;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0e1612;--surface:#17221b;--ink:#e6f0ea;--muted:#9bb0a4;--line:#2b3b31;--green-soft:#1c3526;--head:#0a2417;--focus:#7db3ff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 Calibri,"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.top{background:var(--head);color:#fff;padding:20px clamp(16px,4vw,40px) 0}
.top h1{margin:0;font-size:clamp(19px,2.8vw,28px);line-height:1.2;font-weight:700}
.top p{margin:4px 0 0;color:#cfe6d8;font-size:14px}
.tabs{display:flex;gap:4px;margin-top:18px}
.tabs button{border:0;background:transparent;color:#cfe6d8;padding:10px 20px;font-weight:600;border-radius:8px 8px 0 0;cursor:pointer}
.tabs button:hover{background:rgba(255,255,255,.1)}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--ink)}
main{max-width:1200px;margin:0 auto;padding:22px clamp(16px,4vw,40px) 24px}
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
.side{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
label.l{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input[type=search],select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#list{list-style:none;margin:10px 0 0;padding:0;max-height:62vh;overflow:auto}
#list button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:6px;cursor:pointer}
#list button:hover{background:var(--green-soft)}
#list button[aria-current=true]{background:var(--green);color:var(--on-green);font-weight:600}
.num{min-width:2.2ch;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
[aria-current=true] .num{color:inherit}
.empty{color:var(--muted);padding:8px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px}
.res h2{margin:0;font-size:26px;line-height:1.25}
.meta{margin:4px 0 0;color:var(--muted)}
.kode{display:inline-block;background:var(--green);color:var(--on-green);font-weight:700;border-radius:4px;padding:0 10px;margin-right:10px;font-size:22px;vertical-align:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--green)}
.chip[aria-pressed=true]{background:var(--green);border-color:var(--green);color:var(--on-green);font-weight:600}
.chip.off{color:var(--muted);border-style:dashed}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--green)}
.day{margin-top:20px}
.day h3{margin:0;font-size:17px;padding-bottom:6px;border-bottom:2px solid var(--green);display:flex;justify-content:space-between;gap:8px}
.day h3 small{font-weight:400;color:var(--muted);font-size:14px}
.row{display:grid;grid-template-columns:120px minmax(0,1fr) 110px minmax(0,1.3fr);gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row .w{font-weight:600;font-variant-numeric:tabular-nums}
.room{display:inline-block;min-width:84px;text-align:center;background:var(--green);color:var(--on-green);font-weight:700;font-size:20px;padding:3px 12px;border-radius:4px}
.loc{color:var(--muted)}
.none{margin:12px 0 0;color:var(--muted)}
.ctl{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px;margin:16px 0 4px}
.status{color:var(--muted);font-size:14px;margin:8px 0 0;min-height:21px}
.sesi{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.sesi h3{margin:0;font-size:18px}
.sesi h3 small{font-weight:400;color:var(--muted);font-size:15px;margin-left:8px}
.ged{margin:16px 0 6px;font-weight:700;font-size:15px}
.ged small{font-weight:400;color:var(--muted);margin-left:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:8px}
.tile{display:block;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;cursor:pointer}
.tile:hover{border-color:var(--green)}
.tile b{font-size:18px}
.tile span{display:block;font-size:13px;line-height:1.3;color:var(--muted);margin-top:2px}
.tile.hit{background:var(--green);border-color:var(--green);color:var(--on-green)}
.tile.hit span{color:#0b3a1c}
.tile.dim{opacity:.3}
.notes{max-width:1200px;margin:0 auto;padding:0 clamp(16px,4vw,40px) 40px;color:var(--muted);font-size:14px}
.notes h2{font-size:15px;margin:0 0 4px;color:var(--ink)}
.notes ol{margin:0;padding-left:20px}
[hidden]{display:none!important}
@media(max-width:820px){.split{grid-template-columns:1fr}.side{position:static}#list{max-height:34vh}.ctl{grid-template-columns:1fr}}
@media(max-width:620px){.row{grid-template-columns:1fr auto;gap:2px 12px}.row .loc{grid-column:1/-1}.row .w{grid-column:1/-1}.res{padding:16px}}
@media print{
 body{background:#fff;color:#000}.top{background:none;color:#000;padding:0 0 8px;border-bottom:2px solid #000}.top p{color:#000}
 .tabs,.side,.chips,.btn,.notes,.ctl{display:none!important}
 .split{display:block}.res{border:0;padding:0}main{padding:12px 0}
 .room,.kode{background:#fff!important;border:2px solid #000;color:#000}
 .row{break-inside:avoid}.day{break-inside:avoid}
}
</style>
</head>

    if(st.pday>=0&&st.pday!==di)return;
    if(!by[di].length){ if(st.pday===di){h+=`<div class="day"><h3>${esc(d.hari)}</h3><p class="none">Tidak bertugas pada hari ini.</p></div>`;any=true;} return;}
    any=true;
    h+=`<div class="day"><h3>${esc(d.hari)}<small>${by[di].length} sesi</small></h3>`+
     by[di].map(x=>{const s=d.sesi[x.s],r=rooms[x.r];
       return `<div class="row"><span class="w">${esc(dash(s.waktu))}</span><span>${esc(s.mapel)}</span><span><span class="room">${esc(r.kode)}</span></span><span class="loc">${esc(r.gedung)} · Pondok ${r.pondok}</span></div>`}).join('')+`</div>`;
  });
  $('out-p').innerHTML=h;
  $('out-p').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{st.pday=+b.dataset.d;renderSup();});
  $('cetak').onclick=()=>window.print();
  const cur=$('list').querySelector('[aria-current=true]');
  if(cur)cur.scrollIntoView({block:'nearest'});
}

/* ---- per hari ---- */
function renderDay(){
  $('dchips').innerHTML=days.map((d,di)=>`<button class="chip" aria-pressed="${st.dday===di}" data-d="${di}">${esc(dayLabel(d))}</button>`).join('');
  $('dchips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{st.dday=+b.dataset.d;renderDay();});
  const pond=+$('pond').value, q=norm($('hl').value.trim());
  const match=c=>q&&(norm(names[c]).includes(q)||String(c)===q);
  const d=days[st.dday];let hits=0,h='';
  d.sesi.forEach((s,si)=>{
    h+=`<div class="sesi"><h3>Sesi ${si+1}<small>${esc(dash(s.waktu))} · ${esc(s.mapel)}</small></h3>`;
    let last=null;
    rooms.forEach((r,ri)=>{
      if(pond&&r.pondok!==pond)return;
      if(r.gedung!==last){ if(last!==null)h+='</div>'; h+=`<div class="ged">${esc(r.gedung)}<small>Pondok ${r.pondok}</small></div><div class="tiles">`; last=r.gedung;}
      const c=s.grid[ri], m=match(c); if(m)hits++;
      h+=`<button class="tile${q?(m?' hit':' dim'):''}" data-c="${c}" title="Buka jadwal ${esc(names[c])}"><b>${esc(r.kode)}</b><span>${c} · ${esc(names[c])}</span></button>`;
    });
    h+='</div></div>';
  });
  $('out-h').innerHTML=h;
  $('status').textContent=q?(hits?`${hits} ruangan cocok pada ${d.hari}.`:`Tidak ada pengawas yang cocok pada ${d.hari}.`):`${d.hari} · ${d.sesi.length} sesi`;
}
$('pond').onchange=renderDay;$('hl').oninput=renderDay;
$('out-h').onclick=e=>{const b=e.target.closest('.tile');if(b){st.sup=+b.dataset.c;st.pday=st.dday;$('q').value='';renderList();setTab('p');window.scrollTo(0,0);}};

$('notes').innerHTML='<h2>Keterangan</h2><ol>'+D.notes.map(n=>`<li>${esc(n)}</li>`).join('')+'</ol>';
renderList();renderSup();
</script>
